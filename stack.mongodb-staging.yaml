# Staging synthétique isolé. Les deux réplicas applicatifs sont arrêtés par défaut.
version: "3.8"

services:
  mongo:
    image: mongo@sha256:1d7a2d487c6465ea022474b90b65d6c91bb600b421b65880d8c6e141d6122200
    user: "999:999"
    read_only: true
    cap_drop: [ALL]
    entrypoint: [mongod]
    command:
      - --bind_ip_all
      - --dbpath
      - /data/db
      - --replSet
      - cv-stage-rs
      - --auth
      - --keyFile
      - /run/secrets/replica_key
      - --tlsMode
      - requireTLS
      - --tlsCertificateKeyFile
      - /run/secrets/server_tls
      - --tlsCAFile
      - /run/secrets/mongo_ca
      - --tlsAllowConnectionsWithoutCertificates
      - --wiredTigerCacheSizeGB
      - "0.256"
      - --oplogSize
      - "128"
    environment:
      HOME: /tmp
      MONGOSH_DISABLE_TELEMETRY: "1"
    secrets:
      - {source: mongo_server_tls, target: server_tls, uid: "999", gid: "999", mode: 0400}
      - {source: mongo_replica_key, target: replica_key, uid: "999", gid: "999", mode: 0400}
      - {source: mongo_ca, target: mongo_ca, uid: "999", gid: "999", mode: 0400}
    volumes:
      - mongo_data:/data/db
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 67108864
      - type: tmpfs
        target: /data/configdb
        tmpfs:
          size: 16777216
    networks:
      data:
        aliases: [mongo.cv-stage.internal]
    healthcheck:
      test:
        - CMD
        - mongosh
        - --norc
        - --quiet
        - --host
        - localhost
        - --tls
        - --tlsCAFile
        - /run/secrets/mongo_ca
        - --eval
        - "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    deploy:
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints: [node.labels.cinevault == api]
      resources:
        limits: {cpus: "0.75", memory: 768M}
        reservations: {memory: 384M}
      restart_policy: {condition: on-failure, delay: 5s, max_attempts: 3, window: 120s}
      update_config: {parallelism: 1, order: stop-first, monitor: 45s, failure_action: pause}

  api:
    image: ${CINEVAULT_STAGE_API_IMAGE:?Verified staging API image required}
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    environment:
      ENTERPRISE_ENABLED: "true"
      STORAGE_BACKEND: mongodb
      MONGODB_DATABASE: cinevault_stage
      MONGODB_URI_FILE: /run/secrets/mongo_app_uri
      REGISTRATION_ADMISSION_FILE: /data/registration-admission.json
      METADATA_ENABLED: "false"
      METADATA_CACHE_FILE: /data/metadata-cache.json
      AUTH_THROTTLE_KEY_FILE: /run/secrets/auth_throttle
      CLIENT_CONTEXT_KEY_FILE: /run/secrets/client_context
      CLIENT_CONTEXT_REQUIRED: "true"
    secrets:
      - {source: mongo_app_uri, target: mongo_app_uri, uid: "10001", gid: "10001", mode: 0400}
      - {source: mongo_ca, target: mongo_ca, uid: "10001", gid: "10001", mode: 0400}
      - {source: auth_throttle, target: auth_throttle, uid: "10001", gid: "10001", mode: 0400}
      - {source: client_context, target: client_context, uid: "10001", gid: "10001", mode: 0400}
    volumes:
      - api_sidecars:/data
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 67108864
    networks: [front, data]
    stop_grace_period: 20s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    deploy:
      replicas: ${CINEVAULT_STAGE_APP_REPLICAS:-0}
      placement:
        constraints: [node.labels.cinevault == api]
      resources:
        limits: {cpus: "0.75", memory: 384M}
        reservations: {memory: 128M}
      restart_policy: {condition: on-failure, delay: 5s, max_attempts: 3, window: 120s}
      update_config: {parallelism: 1, order: stop-first, monitor: 45s, failure_action: pause}

  web:
    image: ${CINEVAULT_STAGE_WEB_IMAGE:?Verified staging web image required}
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    environment:
      API_URL: http://api:8000
      ENTERPRISE_ENABLED: "true"
      SECRET_KEY_FILE: /run/secrets/web_session
      SECRET_KEY: ""
      COOKIE_SECURE: "false"
      CLIENT_CONTEXT_KEY_FILE: /run/secrets/client_context
    secrets:
      - {source: web_session, target: web_session, uid: "10001", gid: "10001", mode: 0400}
      - {source: client_context, target: client_context, uid: "10001", gid: "10001", mode: 0400}
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 67108864
    networks: [front]
    stop_grace_period: 20s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    deploy:
      replicas: ${CINEVAULT_STAGE_APP_REPLICAS:-0}
      placement:
        constraints: [node.labels.cinevault == web]
      resources:
        limits: {cpus: "0.5", memory: 256M}
        reservations: {memory: 64M}
      restart_policy: {condition: on-failure, delay: 5s, max_attempts: 3, window: 120s}
      update_config: {parallelism: 1, order: stop-first, monitor: 45s, failure_action: pause}

volumes:
  mongo_data: {external: true, name: cvstage_mongo_data_v1}
  api_sidecars: {external: true, name: cvstage_api_sidecars_v1}

secrets:
  mongo_server_tls: {external: true, name: cvstage_mongo_server_tls_v1}
  mongo_replica_key: {external: true, name: cvstage_mongo_replica_key_v1}
  mongo_ca: {external: true, name: cvstage_mongo_ca_v1}
  mongo_app_uri: {external: true, name: cvstage_mongo_app_uri_v1}
  auth_throttle: {external: true, name: cvstage_auth_throttle_v1}
  web_session: {external: true, name: cvstage_web_session_v1}
  client_context: {external: true, name: cvstage_client_context_v1}

networks:
  front:
    driver: overlay
    driver_opts: {encrypted: ""}
    internal: true
  data:
    driver: overlay
    driver_opts: {encrypted: ""}
    internal: true
