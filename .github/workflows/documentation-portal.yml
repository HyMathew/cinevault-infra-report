name: Static documentation portal
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: documentation-portal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --audit-level=low
      - run: npm run check:reproducible
      - run: npm run sbom
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.os == 'ubuntu-24.04'
        with:
          python-version: '3.13'
      - name: Install pinned browser tooling in its own environment
        if: matrix.os == 'ubuntu-24.04'
        shell: python
        run: |
          import subprocess
          import venv
          from pathlib import Path
          environment = Path('.cache/browser-venv').absolute()
          venv.EnvBuilder(with_pip=True).create(environment)
          python = environment / 'bin/python'
          subprocess.run([str(python), '-m', 'pip', 'install', '--only-binary=:all:', '--require-hashes', '-r', '../requirements-browser.txt'], check=True)
          subprocess.run([str(python), '-m', 'pip', 'check'], check=True)
      - name: Install the pinned Playwright Chromium revision
        if: matrix.os == 'ubuntu-24.04'
        run: .cache/browser-venv/bin/python -m playwright install --with-deps chromium
      - name: Exercise actual pages, French search, keyboard and axe
        if: matrix.os == 'ubuntu-24.04'
        run: .cache/browser-venv/bin/python scripts/check_browser.py --report-dir .cache/browser-report
      - name: Keep static site, repeatability receipt, SBOM and browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-portal-${{ matrix.os }}
          path: |
            portal/dist/
            portal/.cache/reproducibility.json
            portal/.cache/sbom.cdx.json
            portal/.cache/browser-report/
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
