name: Enterprise JSON pair contract
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: enterprise-pair-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pair:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: cinevault-infra-report
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: HyMathew/cinevault-api
          ref: c0a6d61625da8bfa0967be0bdc6cf950ae66420d
          path: cinevault-api
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: HyMathew/cinevault-web
          ref: 53735465a081d4382c3a44874a441080024b32d1
          path: cinevault-web
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install each service in its own pinned environment
        shell: python
        run: |
          import os
          import subprocess
          import sys
          from pathlib import Path
          for service in ("api", "web"):
              environment = Path(f".venv-{service}").resolve()
              subprocess.run([sys.executable, "-m", "venv", str(environment)], check=True)
              python = environment / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
              subprocess.run([str(python), "-m", "pip", "install", "-r", f"cinevault-{service}/requirements-dev.txt"], check=True)
              subprocess.run([str(python), "-m", "pip", "check"], check=True)
      - name: Exercise real API HTTP and isolated JSON persistence
        shell: python
        run: |
          import os
          import subprocess
          from pathlib import Path
          executable = "Scripts/python.exe" if os.name == "nt" else "bin/python"
          # Keep the venv symlink: resolving it selects the base Python on Linux.
          api_python = (Path(".venv-api") / executable).absolute()
          web_python = (Path(".venv-web") / executable).absolute()
          subprocess.run([
              str(web_python), "cinevault-infra-report/scripts/check_enterprise_pair.py",
              "--api-root", "cinevault-api", "--web-root", "cinevault-web",
              "--api-python", str(api_python),
              "--report", "cinevault-infra-report/reports/pair-check.json"
          ], check=True)
      - name: Keep the exact-pair receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: enterprise-json-pair-${{ matrix.os }}
          path: cinevault-infra-report/reports/pair-check.json
          retention-days: 7
          if-no-files-found: warn
