# Promote one verified candidate documentation artifact without rebuilding it.
name: Publish qualified candidate documentation
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: documentation-pages-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'HyMathew/cinevault-infra-report' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download and verify exactly the qualified Ubuntu candidate
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import hashlib, io, json, os, pathlib, stat, urllib.error, urllib.parse, urllib.request, zipfile
          REPO = 'HyMathew/cinevault-infra-report'
          COMMIT = 'b409a6c0f3b6421ef1bd7b60de35718bef38241c'
          RUN = 45905995989
          ARTIFACT = 15157843490
          DIGEST = 'fceae7f23abfc10ef5a29e3f5f193888ed5c6c10686ab7e5454257d45c700f6a'
          ARCHIVE_SIZE = 11069196
          ROOT = f'https://api.github.com/repos/{REPO}/'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json', 'User-Agent': 'CineVault-portal-promotion',
                     'X-GitHub-Api-Version': '2026-03-10'}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, hdrs, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          def api(path):
              with opener.open(urllib.request.Request(ROOT + path, headers=headers), timeout=60) as r:
                  return json.load(r)
          run = api(f'actions/runs/{RUN}')
          assert run['repository']['full_name'] == REPO
          assert run['head_sha'] == COMMIT and run['head_branch'] == 'quality/cinevault-v2'
          assert run['path'] == '.github/workflows/documentation-portal.yml'
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          a = api(f'actions/artifacts/{ARTIFACT}')
          assert a['id'] == ARTIFACT and a['name'] == 'documentation-portal-ubuntu-24.04'
          assert not a['expired'] and a['digest'] == 'sha256:' + DIGEST
          assert a['size_in_bytes'] == ARCHIVE_SIZE
          assert a['workflow_run']['id'] == RUN and a['workflow_run']['head_sha'] == COMMIT
          # Stop the API redirect before sending any authorization to blob storage.
          try:
              opener.open(
                  urllib.request.Request(ROOT + f'actions/artifacts/{ARTIFACT}/zip', headers=headers), timeout=60)
              raise RuntimeError('Expected an artifact archive redirect')
          except urllib.error.HTTPError as e:
              assert e.code == 302
              location = e.headers['Location']
          location_parts = urllib.parse.urlsplit(location)
          assert location_parts.scheme == 'https' and location_parts.hostname
          assert location_parts.username is None and location_parts.password is None
          with urllib.request.urlopen(location, timeout=60) as r:
              data = r.read(ARCHIVE_SIZE + 1)
          assert len(data) == ARCHIVE_SIZE and hashlib.sha256(data).hexdigest() == DIGEST
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              names = z.namelist()
              assert len(names) == len(set(names)) <= 1200
              assert sum(item.file_size for item in z.infolist()) < 96 * 1024 * 1024
              for item in z.infolist():
                  p = pathlib.PurePosixPath(item.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in item.filename
                  assert p.parts[0] in ('dist', '.cache')
                  assert not stat.S_ISLNK(item.external_attr >> 16)
              assert z.testzip() is None
              receipt = json.loads(z.read('dist/build-receipt.json'))
              assert receipt['source_commit'] == COMMIT
              assert receipt['source_clean'] and receipt['tooling_clean']
              assert receipt['base'] == '/cinevault-infra-report'
              assert receipt['checks']['passed'] and receipt['checks']['htmlPages'] == 60
              assert receipt['checks']['checkedLinks'] == 6201 and not receipt['checks']['errors']
              repro = json.loads(z.read('.cache/reproducibility.json'))
              assert repro['passed'] and repro['builds'] == 2 and len(repro['files']) == 478
              dist = {n[5:]: z.read(n) for n in names if n.startswith('dist/') and not n.endswith('/')}
              assert set(dist) == {f['path'] for f in repro['files']}
              assert all(hashlib.sha256(dist[f['path']]).hexdigest() == f['sha256'] for f in repro['files'])
              browser = json.loads(z.read('.cache/browser-report/receipt.json'))
              assert browser['build_receipt'] == receipt and browser['passed']
              assert len(browser['checks']) == 213 and all(c['passed'] for c in browser['checks'])
              assert not browser['page_errors'] and browser['owned_server_stopped']
              pdf = dist['sources/report/enterprise-2.1/RT0705_CineVault_Mathieu_Kuhnapfel.pdf']
              assert hashlib.sha256(pdf).hexdigest() == '8c70cd4b392e9b79d70ff8a1a4b90f10cb674742faf4c11cfe94e43ea17eed5a'
              assert hashlib.sha256(dist['sources/evidence/public/compose-clean-clone-20261126.json']).hexdigest() == '4432142c2bdb43c9f45466f30330319cad426b3209a91b6c2db64e3cd369ee7f'
              assert hashlib.sha256(dist['sources/evidence/public/image-release-provenance-preflight-20261126.json']).hexdigest() == '238409ffbff64489656b17a783c856b550ff2cf5c34ac04289f4b9621e4e7be8'
              assert hashlib.sha256(dist['sources/evidence/public/swarm-https-certificate-rotation-20261126.json']).hexdigest() == '813a34ee76560031001462ce807095597e83b14be8e79d87a5ec5e0cae5eacf6'
              assert hashlib.sha256(dist['sources/evidence/public/mongodb-ca-rollover-20261126.json']).hexdigest() == '377dc2446186d49fd0bf68ec9a8596d710e14756b16eb54c1c9a36e6a7911b5e'
              assert hashlib.sha256(dist['sources/evidence/public/operational-tls-expiry-20261126.json']).hexdigest() == '6c635dbf12d6b04670673742040d35376f8ba559c3e2ee731b87610bb3235352'
              assert hashlib.sha256(dist['sources/evidence/public/mongodb-scram-rotation-20261126.json']).hexdigest() == '9c3460dc6d92a6d046369b458544500abdfb49f44a83a7102240b72d45639a5f'
              assert hashlib.sha256(dist['sources/evidence/public/mongodb-quarantine-current-20261126.json']).hexdigest() == '5646232d18344522efd1178aada383383cc263097a9fc526758442077be13bde'
              assert hashlib.sha256(dist['sources/evidence/public/mongodb-election-idempotency-20261126.json']).hexdigest() == '4c37e4da32f520e4404540a2099f8015451788c9c4ceed40bb45a7236f3566f2'
              assert hashlib.sha256(dist['sources/evidence/public/swarm-predeployment-readiness-20261126.json']).hexdigest() == 'abcea5692bf839b0a5c272d1caef3dbddc73043c6a22f98b67db00d4b1c3e898'
              assert hashlib.sha256(dist['sources/scripts/check_swarm_readiness.py']).hexdigest() == '4ad87451d786a276f9eab9195e20729d9632158d9fd699077fb0c3852bcffcf6'
              assert hashlib.sha256(dist['sources/evidence/public/openssl-lock-preflight-20261126.json']).hexdigest() == '04ae3dc26dd9d1d5732b7d0525134812d18c35c29270c501c573cc529e8566ce'
              assert hashlib.sha256(dist['sources/scripts/prepare_openssl_locks.py']).hexdigest() == '7a7a60ff221f45dcf348ea8863523c99d18cefa2e6b631c836236fe758d96d7f'
              assert hashlib.sha256(dist['sources/evidence/public/staging-bootstrap-mongo-20261126.json']).hexdigest() == 'c323921430744826f950858e6879386ab946db817818eb18fdcbb06204b5e018'
              assert hashlib.sha256(dist['sources/evidence/public/staging-bootstrap-inputs-20261126.json']).hexdigest() == 'b2bd308cd64d5070ceab7025ca4ee81a0d44bdab5dc0021a52eb07dbbd3a584c'
              assert hashlib.sha256(dist['sources/evidence/public/openssl-lock-atomic-proposal-20261126.json']).hexdigest() == '910686914d893a67899ed0b439b30c66d2e8e6f95287daefbb76d55fb79e95f5'
              assert hashlib.sha256(dist['sources/evidence/public/staging-release-gate-20261126.json']).hexdigest() == 'd670a1296bc202ae4d0069c7c6df938c36432ea92faa214f39b3b74185cac2b4'
              assert hashlib.sha256(dist['sources/scripts/check_staging_image_release.py']).hexdigest() == '8e880d7ab21709908e676b6db5c0983e77d4022227bc2ebf7133bd23dcc4117c'
              assert hashlib.sha256(dist['sources/evidence/public/image-attestation-exact-attempt-20261126.json']).hexdigest() == 'e92301b9d9c836b9e4f2054ccb1b8944a7dc1b1f8ffec5250602b19e272ebbf7'
              assert hashlib.sha256(dist['sources/evidence/public/browser-pair-keyboard-20261126.json']).hexdigest() == '17140071adf70f99371f20716684a5bccc9ec9da699443d2209248c1c3a783fa'
              assert hashlib.sha256(dist['sources/evidence/public/browser-movie-keyboard-20261126.json']).hexdigest() == '84f36a724b985228979734e0f8ef9fe52ab55365a19ec508c1bcc6ca10322cb5'
              assert hashlib.sha256(dist['sources/evidence/public/mongodb-backup-expiry-boundaries-20261126.json']).hexdigest() == '2250b52ce07d5a18212c8d02fb6b2df951dc3b94cee51c4175f72686f79d47ca'
              assert hashlib.sha256(dist['sources/evidence/public/academic-json-api-4c74c86-20261126.json']).hexdigest() == '98cbf54701d07f0bd01d737a977990fbb6edd50f70903159566e3e25f162c26e'
              assert hashlib.sha256(dist['sources/evidence/public/academic-json-api-31ee4ea-20261126.json']).hexdigest() == '40908b09cda079b1df80a3cf2c71b0bcddb2c6904315a36fbadd1bbc187bb9ee'
              assert hashlib.sha256(dist['sources/evidence/public/mixed-https-baseline-20261126.json']).hexdigest() == 'c7e42cc200ca8df8c0988a8507f4764c1a3fa252d5fe9dca1cd0644e1c4fc3ee'
              assert hashlib.sha256(dist['sources/evidence/public/mixed-https-json-read-lock-20261126.json']).hexdigest() == '95b8b28cb32bbc57864698695bf1f47c8e1a67088af934a79948647296260ee5'
              assert hashlib.sha256(dist['sources/evidence/public/stack-config-exact-20261126.json']).hexdigest() == '88339e26b2def6e41be3090587cdf8dcc3625076068c91313ba57bcf67780113'
              assert hashlib.sha256(dist['sources/evidence/public/mixed-https-exact-ci-20261126.json']).hexdigest() == 'd86929fe8e5825817fffbd5c887c4a896f571607b686328d8ca0592f1b4541e5'
              assert hashlib.sha256(dist['sources/evidence/public/operational-proxy-http-20261126.json']).hexdigest() == '04babf6c2f11879cf4d3dfc9fae4012aa6f48e1ba869a6546fdb8809e1a147e7'
              assert hashlib.sha256(dist['sources/evidence/public/operational-attempt-verification-20261126.json']).hexdigest() == 'c5837a1e7020ef3992fdc7fec2e4d4cb3314991db9a5b51f8420fb4ebee39059'
              assert hashlib.sha256(dist['sources/evidence/public/operational-watch-delivery-20261126.json']).hexdigest() == '003bd0f24879fd6d0f2b6496b6f869e0f5a9069671a1c1c966a3e66bb31b8f5b'
              assert hashlib.sha256(dist['sources/scripts/supervise_operational_health.py']).hexdigest() == '12837b3cbf023766ef0e46fd9eae5b5142ec1a190cdb1c27ca41d4cc160ae3d6'
              assert hashlib.sha256(dist['sources/evidence/public/operational-watch-cross-host-20261126.json']).hexdigest() == 'dbf82ae67d2099edf6bd3b3997bf4e3be69061bcf5e246b00bee9f58dfc4b05c'
              assert hashlib.sha256(dist['sources/evidence/public/staging-image-pair-preflight-20261126.json']).hexdigest() == '5ac637c4d0d69e5a0d54bf37bbadf1e147e767d53b2d92c8cb374451efe96e22'
              assert hashlib.sha256(dist['sources/scripts/check_staging_image_pair.py']).hexdigest() == '181ea8358d64ea9430e80bdafd7afb8284255bd7bd50ebf6f0a6d844027acf7b'
              assert hashlib.sha256(dist['sources/evidence/public/native-http-cutover-current-20261126.json']).hexdigest() == 'f5d323509d7becd666bf8b62f2b3f2bb122de9b1d8ff6e821d244f18702fe56e'
              assert hashlib.sha256(dist['sources/evidence/public/browser-pair-firefox-20261126.json']).hexdigest() == '9ab032d63b2689ededd22e42f486da848d0653315c40efab0fda04c83c81af65'
              assert hashlib.sha256(dist['sources/evidence/public/operating-probe-backup-verification-20261126.json']).hexdigest() == '2186cc86191c0b2275aa6faf0f612c03c9448007b8b084a6ac8e603d63cae826'
              assert hashlib.sha256(dist['sources/evidence/public/mongodb-backup-freshness-20261126.json']).hexdigest() == 'cf3e2c0abbfd4d8857e839069a8cfe45403c3a21f288032193f430552b7b59b8'
              assert hashlib.sha256(dist['sources/evidence/public/mongodb-backup-http-20261126.json']).hexdigest() == 'ddb16c934817005d3333c26924e6a35b5259d594e34be50ecf246a8b6cf520ca'
              assert hashlib.sha256(dist['sources/evidence/public/swarm-https-hsts-20261126.json']).hexdigest() == '8b3f49d139ae96ce1b0e6550b461003d2858634bdaf073c3cff05bc19557bd6c'
              assert hashlib.sha256(dist['sources/evidence/public/chromium-backend-performance-20261125.json']).hexdigest() == '270ab1ee501dac32d0f14ed88b634320b6cf8db0d30ec726d8f473a8aad0762e'
              assert hashlib.sha256(dist['sources/evidence/public/enterprise-2.1-alpine-runtime-20261125.json']).hexdigest() == 'b1d21d28ce6af68f8c49053a6ed0ade5c383b3de84b1bdf1118da5a6b1bba121'
              assert hashlib.sha256(dist['sources/evidence/public/swarm-https-pc-rollback-20261125.json']).hexdigest() == 'a058303733c8b57e0f1631ba326c61606cb98c79b1441a6f4656c08ff7160cf4'
              assert hashlib.sha256(dist['sources/evidence/public/application-image-cross-environment-20261125.json']).hexdigest() == '798ed363c53dc9b93bbf35c55cfdde5c273b2e05be0c7ad3f7cdb52fff88fd63'
              assert hashlib.sha256(dist['sources/evidence/public/swarm-rollback-data-20261125.json']).hexdigest() == '3776cacf2312af16a339cadd6be4b7b19219ab7897dbbe38c4010713bed3e3e3'
              assert hashlib.sha256(dist['sources/evidence/public/swarm-mongodb-overlay-tls-20261125.json']).hexdigest() == '5e34d9b366f3292a2b449fb9ea20679cac29fcd84b02713d7cb126029ea4b896'
              home = dist['index.html'].decode('utf-8')
              assert 'en préparation' in home and 'pas une validation finale' in home
              target = pathlib.Path('qualified-site')
              target.mkdir(exist_ok=False)
              for name, content in dist.items():
                  dest = target.joinpath(*pathlib.PurePosixPath(name).parts)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(content)
          print('Verified qualified candidate: 478 exact dist files; 60 HTML; 213 retained browser checks.')
      - name: Package exact public files including linked dot-directory sources
        shell: bash
        run: |
          tar --directory qualified-site --format=posix --exclude='./.cinevault-output.json' -cf "$RUNNER_TEMP/artifact.tar" .
          python - <<'PY'
          import os, pathlib, tarfile
          with tarfile.open(pathlib.Path(os.environ['RUNNER_TEMP']) / 'artifact.tar') as t:
              files = [m for m in t.getmembers() if m.isfile()]
              assert len(files) == 477
              assert all(m.isfile() or m.isdir() for m in t.getmembers())
              assert './sources/.github/workflows/browser-pair.yml' in t.getnames()
              assert './sources/.agents/skills/anti-slop-cinevault/LICENSE' in t.getnames()
              assert './.cinevault-output.json' not in t.getnames()
          PY
      - name: Upload the exact tar using the Pages artifact uploader version
        id: pages-tar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, used by upload-pages-artifact v4
        with:
          path: ${{ runner.temp }}/artifact.tar
          name: github-pages
          retention-days: 1
          if-no-files-found: error
      - name: Confirm the uploaded artifact stays visible before Pages deployment
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages-tar.outputs.artifact-id }}
        run: |
          import json, os, time, urllib.request
          artifact_id = int(os.environ['PAGES_ARTIFACT_ID'])
          run_id = int(os.environ['GITHUB_RUN_ID'])
          repository = 'HyMathew/cinevault-infra-report'
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/actions/runs/{run_id}/artifacts?name=github-pages',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                       'Accept': 'application/vnd.github+json',
                       'User-Agent': 'CineVault-Pages-Artifact-Visibility'})
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, hdrs, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          visible_since = None
          deadline = time.monotonic() + 90
          # The Pages action lists artifacts through the Actions results service.
          # Its view can lag behind this REST listing immediately after upload.
          while time.monotonic() < deadline:
              with opener.open(request, timeout=10) as response:
                  data = response.read(1024 * 1024 + 1)
              assert len(data) <= 1024 * 1024
              items = json.loads(data)['artifacts']
              if items:
                  assert len(items) == 1 and items[0]['id'] == artifact_id
                  assert items[0]['name'] == 'github-pages' and items[0]['expired'] is False
                  if visible_since is None:
                      visible_since = time.monotonic()
                  elif time.monotonic() - visible_since >= 25:
                      break
              else:
                  visible_since = None
              time.sleep(5)
          else:
              raise RuntimeError('The uploaded Pages artifact did not stay visible in the run listing')
      - name: Deploy candidate documentation
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
