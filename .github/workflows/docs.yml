name: Documentation and synthetic JSON examples
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  documents:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: cinevault-infra-report
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: HyMathew/cinevault-api
          ref: 6a86f2eba9de4dd704c7d4a38d93ab75ff32adc5
          path: cinevault-api
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install pinned API development dependencies
        run: python -m pip install -r cinevault-api/requirements-dev.txt
      - run: python -m pip check
      - name: Validate public documents and source diagrams offline
        run: python -B cinevault-infra-report/scripts/check_docs.py
      - name: Verify synthetic examples against pinned API source and schemas
        run: python -B cinevault-infra-report/scripts/academic_json_examples.py --api-root cinevault-api
      - name: Verify corrupted examples are detected
        run: python -B cinevault-infra-report/scripts/test_academic_json_examples.py -v
      - name: Compile PDF with verified pinned Typst and embedded fonts
        run: python -B cinevault-infra-report/scripts/build_report.py
      - name: Keep compiled report and receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-${{ matrix.os }}
          path: |
            cinevault-infra-report/report/RT0705_CineVault_Mathieu_Kuhnapfel.pdf
            cinevault-infra-report/report/build-receipt.json
          retention-days: 7
          if-no-files-found: error
