name: Documentation and synthetic JSON examples
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  documents:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: cinevault-infra-report
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: HyMathew/cinevault-api
          ref: 6a86f2eba9de4dd704c7d4a38d93ab75ff32adc5
          path: cinevault-api
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install pinned API development dependencies
        run: python -m pip install -r cinevault-api/requirements-dev.txt
      - run: python -m pip check
      - name: Validate public documents and source diagrams offline
        run: python -B cinevault-infra-report/scripts/check_docs.py
      - name: Verify synthetic examples against pinned API source and schemas
        run: python -B cinevault-infra-report/scripts/academic_json_examples.py --api-root cinevault-api
      - name: Verify corrupted examples are detected
        run: python -B cinevault-infra-report/scripts/test_academic_json_examples.py -v
      - name: Compile PDF with verified pinned Typst and embedded fonts
        run: python -B cinevault-infra-report/scripts/build_report.py
      - name: Keep compiled report and receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-${{ matrix.os }}
          path: |
            cinevault-infra-report/report/RT0705_CineVault_Mathieu_Kuhnapfel.pdf
            cinevault-infra-report/report/build-receipt.json
          retention-days: 7
          if-no-files-found: error
      - name: Check HTTP correlation and the operating probe
        working-directory: cinevault-infra-report
        run: python -B -m pytest -q -W error tests/test_http_log_summary.py tests/test_operational_health.py
      - name: Compile Enterprise 2.1 report with pinned Typst
        run: python -B cinevault-infra-report/scripts/build_report.py --edition enterprise-2.1
      - name: Keep Enterprise 2.1 PDF and receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-enterprise-2.1-${{ matrix.os }}
          path: |
            cinevault-infra-report/report/enterprise-2.1/RT0705_CineVault_Mathieu_Kuhnapfel.pdf
            cinevault-infra-report/report/enterprise-2.1/build-receipt.json
          retention-days: 7
          if-no-files-found: error

  candidate-examples:
    name: Replay academic examples on the candidate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      CINEVAULT_EXAMPLES_API_COMMIT: 4dd5cd99287fafdc647dead5ce32dbd42a5c457c
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: cinevault-infra-report
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: cinevault-api
          repository: HyMathew/cinevault-api
          ref: ${{ env.CINEVAULT_EXAMPLES_API_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: >-
          python -m pip install --only-binary=:all: -r cinevault-api/requirements-dev.txt
      - run: python -m pip check
      - name: Execute and validate the in-memory candidate examples
        shell: python
        run: |
          import os
          import subprocess
          import sys
          from pathlib import Path

          with Path("candidate-examples.json").open("xb") as receipt:
              subprocess.run(
                  [sys.executable, "-B", "cinevault-infra-report/scripts/academic_json_examples.py",
                   "--api-root", "cinevault-api",
                   "--replay-api-commit", os.environ["CINEVAULT_EXAMPLES_API_COMMIT"]],
                  check=True, stdout=receipt,
              )
      - name: Keep the candidate replay receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-academic-examples-${{ matrix.os }}
          path: candidate-examples.json
          retention-days: 7
          if-no-files-found: error

  attest-enterprise-report:
    name: Attest the compiled Enterprise 2.1 report
    needs: [documents, candidate-examples]
    if: >-
      github.event_name == 'push' &&
      github.repository == 'HyMathew/cinevault-infra-report' &&
      (github.ref == 'refs/heads/quality/cinevault-v2' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: report-enterprise-2.1-ubuntu-24.04
          path: compiled-report
      - name: Match the candidate PDF to the Git blob and build receipt
        shell: python
        run: |
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          name = "RT0705_CineVault_Mathieu_Kuhnapfel.pdf"
          received = Path("compiled-report", name).read_bytes()
          source = f"report/enterprise-2.1/{name}"
          expected = subprocess.check_output(["git", "show", f"{os.environ['GITHUB_SHA']}:{source}"])
          receipt = json.loads(Path("compiled-report/build-receipt.json").read_bytes())
          if (
              received != expected
              or receipt["filename"] != name
              or receipt["bytes"] != len(received)
              or receipt["sha256"] != hashlib.sha256(received).hexdigest()
          ):
              raise SystemExit("The compiled PDF differs from the tracked candidate or build receipt")
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: report-attestation
        with:
          subject-path: compiled-report/RT0705_CineVault_Mathieu_Kuhnapfel.pdf
      - name: Keep the signed provenance bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: enterprise-report-signed-provenance
          path: ${{ steps.report-attestation.outputs.bundle-path }}
          retention-days: 7
          if-no-files-found: error

  verify-enterprise-report:
    name: Verify Enterprise 2.1 report provenance
    needs: attest-enterprise-report
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: report-enterprise-2.1-ubuntu-24.04
          path: compiled-report
      - name: Check the Sigstore signature and exact source identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh attestation verify compiled-report/RT0705_CineVault_Mathieu_Kuhnapfel.pdf \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/docs.yml" \
            --source-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --deny-self-hosted-runners \
            --format json > report-attestation-verification.json
      - name: Keep the signature verification receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: enterprise-report-verified-provenance
          path: report-attestation-verification.json
          retention-days: 7
          if-no-files-found: error
