name: Portable encrypted MongoDB backup
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mongodb-backup-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable-contract:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.13'
          - os: ubuntu-24.04
            python: '3.12'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Check qualification output and timeout guards
        run: python -B -W error -m unittest discover -s tests -p test_portable_backup_ci.py -v
      - name: Install pinned public tools and execute all crypto contracts
        id: qualification
        run: python -B -W error scripts/check_portable_backup.py --report-dir reports/portable-backup
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
          PIP_NO_INPUT: '1'
          PYTHONDONTWRITEBYTECODE: '1'
      - name: Keep bounded receipts, logs and notices only
        if: always() && (steps.qualification.outcome == 'success' || steps.qualification.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mongodb-backup-${{ matrix.os }}-python-${{ matrix.python }}
          path: reports/portable-backup/
          retention-days: 7
          if-no-files-found: error
